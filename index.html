<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QAP Solver</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 20px auto; }
        .matrix-container { overflow-x: auto; margin-bottom: 20px; max-height: 400px; overflow-y: auto; }
        table { border-collapse: collapse; }
        td { padding: 2px; }
        input[type="number"] { width: 50px; padding: 4px; font-size: 14px; text-align: center; }
        .hidden { display: none; }
        button { padding: 10px 15px; font-size: 16px; cursor: pointer; margin-bottom: 20px;}
        #resultBox { padding: 15px; background: #eef; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Quadratic Assignment Problem Solver</h1>
    
    <label for="nSize">Number of Assignments (N, max 16):</label>
    <input type="number" id="nSize" min="2" max="16" value="4">
    <button onclick="generateMatrices()">Create Matrices</button>

    <div id="solverSection" class="hidden">
        <h3>Distance Matrix</h3>
        <div class="matrix-container" id="distContainer"></div>

        <h3>Flow Matrix</h3>
        <div class="matrix-container" id="flowContainer"></div>

        <button id="solveBtn" disabled>Loading Solver...</button>
        
        <div id="resultBox" class="hidden">
            <strong>Optimal Assignment:</strong> <span id="result"></span>
        </div>
    </div>

    <!-- Load the Emscripten JavaScript glue code -->
    <script src="qap_solver.js"></script>
    
    <script>
        let currentN = 0;
        let isWasmLoaded = false;

        // 1. Wait for WebAssembly to initialize
        Module.onRuntimeInitialized = function() {
            isWasmLoaded = true;
            updateSolveButton();
        };

        // 2. Generate the N x N input grids
        function generateMatrices() {
            const nInput = document.getElementById('nSize').value;
            currentN = parseInt(nInput);
            
            if (currentN < 2 || currentN > 16) {
                alert("Please enter an N between 2 and 16.");
                return;
            }

            document.getElementById('distContainer').innerHTML = buildTableHTML('dist', currentN);
            document.getElementById('flowContainer').innerHTML = buildTableHTML('flow', currentN);
            
            document.getElementById('solverSection').classList.remove('hidden');
            document.getElementById('resultBox').classList.add('hidden');
            updateSolveButton();
        }

        // Helper to build HTML tables
        function buildTableHTML(prefix, n) {
            let html = '<table>';
            for (let i = 0; i < n; i++) {
                html += '<tr>';
                for (let j = 0; j < n; j++) {
                    // Set diagonal to 0 automatically (standard in QAP)
                    const defaultVal = (i === j) ? 0 : 1; 
                    html += `<td><input type="number" id="${prefix}_${i}_${j}" value="${defaultVal}"></td>`;
                }
                html += '</tr>';
            }
            html += '</table>';
            return html;
        }

        function updateSolveButton() {
            const btn = document.getElementById('solveBtn');
            if (isWasmLoaded && currentN > 0) {
                btn.disabled = false;
                btn.innerText = "Solve QAP";
            }
        }

        // Helper to read the HTML table back into a 1D flattened array
        function getFlattenedMatrix(prefix, n) {
            let arr = [];
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n; j++) {
                    let val = document.getElementById(`${prefix}_${i}_${j}`).value;
                    arr.push(Number(val));
                }
            }
            return arr;
        }

        // 3. Handle the Solve button click
        document.getElementById('solveBtn').onclick = () => {
            if (!isWasmLoaded) return;

            // Extract values from the DOM
            const distArr = getFlattenedMatrix('dist', currentN);
            const flowArr = getFlattenedMatrix('flow', currentN);

            // Create C++ vectors from JS arrays
            let distVec = new Module.VectorInt();
            let flowVec = new Module.VectorInt();
            distArr.forEach(val => distVec.push_back(val));
            flowArr.forEach(val => flowVec.push_back(val));

            // Call the C++ function
            let resultVec = Module.solveQAP(currentN, distVec, flowVec);

            // Extract the results back to a JS array
            let resultArr = [];
            for (let i = 0; i < resultVec.size(); i++) {
                resultArr.push(resultVec.get(i));
            }
            
            // Display Result
            document.getElementById('result').innerText = resultArr.join('  ➔  ');
            document.getElementById('resultBox').classList.remove('hidden');

            // Memory Management: Delete C++ objects to prevent memory leaks
            distVec.delete();
            flowVec.delete();
            resultVec.delete();
        };
    </script>
</body>
</html>
