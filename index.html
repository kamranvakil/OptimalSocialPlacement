        body { font-family: sans-serif; max-width: 9It is incredibly common for users to accidentally click destructive buttons, so adding a safety net is a great idea. 

The easiest way to add this check is by using the browser's native `confirm()` dialog. It will pause the action and ask the user to click "OK" or "Cancel" before proceeding.

Here is how you can implement it depending on how your code is set up:

### Option 1: Vanilla JavaScript
If you are using standard HTML and JavaScript, you can intercept the click event.

```javascript
const resetButton = document.getElementById('reset-flows-btn');

resetButton.addEventListener('click', function(event) {
  // Show the confirmation dialog
  const isConfirmed = confirm("Are you sure you want to reset all current flows? This cannot be undone.");
  
  // If the user clicks "Cancel", stop the function early
  if (!isConfirmed) {
    return; 
  }
  
  // If they clicked "OK", your reset logic goes here
  resetCurrentFlows(); 
});
